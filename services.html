<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lovepreet Local Services</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px 14px;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}

.app{
  max-width:520px;
  margin:auto;
}

h1{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:22px;
}

.box{
  background:#1e293b;
  padding:18px;
  border-radius:22px;
}

input,select{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:13px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}

.primary{
  background:white;
  color:#0f172a;
}

.location-btn{
  background:#2563eb;
  color:white;
}

.result{
  margin-top:20px;
}

.card{
  background:white;
  color:#0f172a;
  padding:16px;
  margin-top:12px;
  border-radius:18px;
}

.card h3{
  margin-top:0;
}

.distance{
  color:#2563eb;
  font-weight:bold;
}

.action{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#16a34a;
  color:white;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
}

.error{
  color:#dc2626;
  font-weight:bold;
}

.small{
  color:#64748b;
  font-size:14px;
}
</style>
</head>

<body>

<div class="app">

<h1>📍 Local Service Finder</h1>

<div class="subtitle">
Apne area ke nearby services dhoondo
</div>

<div class="box">

<input
  id="area"
  type="text"
  placeholder="Apna area likho..."
>

<select id="service">

<option value="">Service choose karo</option>

<option value="plumber">🔧 Plumber</option>

<option value="electrician">⚡ Electrician</option>

<option value="mobile">📱 Mobile Repair</option>

<option value="bike">🛵 Bike Repair</option>

<option value="ac">❄️ AC Repair</option>

<option value="barber">💇 Barber</option>

<option value="cleaning">🧹 Cleaning</option>

</select>

<button
  class="location-btn"
  onclick="useMyLocation()"
>
📍 Use My Location
</button>

<button
  class="primary"
  onclick="searchService()"
>
🔎 Search Service
</button>

</div>

<div id="result" class="result"></div>

</div>


<script>

let userLatitude = null;
let userLongitude = null;


/* SERVICE SETTINGS */

const serviceData = {

  plumber: {
    name: "Plumber",
    tags: [
      'craft="plumber"',
      'shop="plumber"',
      'name~"plumb|Plumb|plumber|Plumber"'
    ]
  },

  electrician: {
    name: "Electrician",
    tags: [
      'craft="electrician"',
      'shop="electrical"',
      'name~"electric|Electric|electrical|Electrical"'
    ]
  },

  mobile: {
    name: "Mobile Repair",
    tags: [
      'shop="mobile_phone"',
      'craft="electronics_repair"',
      'name~"mobile|Mobile|repair|Repair"'
    ]
  },

  bike: {
    name: "Bike Repair",
    tags: [
      'shop="motorcycle"',
      'shop="motorcycle_repair"',
      'craft="bicycle_repair"',
      'name~"bike|Bike|motorcycle|Motorcycle"'
    ]
  },

  ac: {
    name: "AC Repair",
    tags: [
      'craft="hvac"',
      'name~"AC|ac|Air Conditioner|air conditioner"'
    ]
  },

  barber: {
    name: "Barber",
    tags: [
      'shop="hairdresser"',
      'shop="barber"',
      'name~"barber|Barber|salon|Salon"'
    ]
  },

  cleaning: {
    name: "Cleaning",
    tags: [
      'craft="cleaning"',
      'name~"cleaning|Cleaning"'
    ]
  }

};


/* LOCATION */

function useMyLocation(){

  const result =
    document.getElementById("result");

  if(!navigator.geolocation){

    result.innerHTML = `
      <div class="card">
        <p class="error">
        ❌ Location support nahi hai.
        </p>
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="card">
      <h3>📍 Location find ho rahi hai...</h3>
      <p>Please location permission allow karo.</p>
    </div>
  `;

  navigator.geolocation.getCurrentPosition(

    function(position){

      userLatitude =
        position.coords.latitude;

      userLongitude =
        position.coords.longitude;

      result.innerHTML = `
        <div class="card">
          <h3>✅ Location mil gayi!</h3>
          <p>
          Ab service select karke
          <b>Search Service</b> dabao.
          </p>
        </div>
      `;

    },

    function(){

      result.innerHTML = `
        <div class="card">
          <h3>❌ Location nahi mili</h3>
          <p>
          Location permission allow karo
          aur dobara try karo.
          </p>
        </div>
      `;

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:60000
    }

  );

}


/* DISTANCE */

function calculateDistance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371;

  const dLat =
    (lat2-lat1) * Math.PI / 180;

  const dLon =
    (lon2-lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  const c =
    2 * Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R*c;
}


/* SEARCH */

async function searchService(){

  const service =
    document.getElementById("service").value;

  const area =
    document.getElementById("area").value.trim();

  const result =
    document.getElementById("result");


  if(!service){

    alert("Pehle service choose karo 😄");
    return;
  }


  if(userLatitude === null){

    if(!area){

      alert(
        "Pehle Use My Location dabao ya area likho 📍"
      );

      return;

    }

    result.innerHTML = `
      <div class="card">
        <h3>📍 Area search</h3>
        <p>
        Abhi GPS ke bina exact nearby
        results ke liye location allow karna
        best rahega.
        </p>
        <p>
        <b>Use My Location</b> dabao.
        </p>
      </div>
    `;

    return;
  }


  const selected =
    serviceData[service];

  result.innerHTML = `
    <div class="card">
      <h3>🔎 ${selected.name} search ho raha hai...</h3>
      <p>Please thoda wait karo.</p>
    </div>
  `;


  try{

    let queryParts = [];


    selected.tags.forEach(tag => {

      queryParts.push(
        `nwr(around:5000,${userLatitude},${userLongitude})[${tag}];`
      );

    });


    const query = `
      [out:json][timeout:20];

      (
        ${queryParts.join("\n")}
      );

      out center tags;
    `;


    const response =
      await fetch(
        "https://overpass-api.de/api/interpreter",
        {
          method:"POST",
          body:query
        }
      );


    if(!response.ok){
      throw new Error("Search failed");
    }


    const data =
      await response.json();


    let places =
      data.elements || [];


    /* ONLY NAMED PLACES */

    places =
      places.filter(place => {

        return place.tags &&
               place.tags.name;

      });


    /* REMOVE DUPLICATES */

    const seen = new Set();

    places =
      places.filter(place => {

        const name =
          place.tags.name;

        if(seen.has(name)){
          return false;
        }

        seen.add(name);
        return true;

      });


    /* DISTANCE */

    places =
      places.map(place => {

        const lat =
          place.lat ??
          place.center?.lat;

        const lon =
          place.lon ??
          place.center?.lon;

        let distance = 999;

        if(lat && lon){

          distance =
            calculateDistance(
              userLatitude,
              userLongitude,
              lat,
              lon
            );

        }

        return {
          ...place,
          latitude:lat,
          longitude:lon,
          distance:distance
        };

      });


    places.sort(
      (a,b) =>
      a.distance-b.distance
    );


    places =
      places.slice(0,15);


    showResults(
      places,
      selected.name
    );


  }catch(error){

    console.error(error);

    result.innerHTML = `
      <div class="card">
        <h3>⚠️ Search problem</h3>

        <p>
        Free map server busy ho sakta hai.
        Thodi der baad dobara try karo.
        </p>

        <p class="small">
        Internet connection bhi check karo.
        </p>
      </div>
    `;

  }

}


/* SHOW RESULTS */

function showResults(
  places,
  serviceName
){

  const result =
    document.getElementById("result");


  if(places.length === 0){

    result.innerHTML = `
      <div class="card">

        <h3>😕 Results nahi mile</h3>

        <p>
        Is area mein OpenStreetMap par
        <b>${serviceName}</b> ki listing
        available nahi mili.
        </p>

        <p class="small">
        Dusri service ya thoda bada area
        try karo.
        </p>

      </div>
    `;

    return;

  }


  let html = `

    <div class="card">

      <h3>
        🔎 ${serviceName} — ${places.length}
        results
      </h3>

      <p class="small">
        Nearby OpenStreetMap listings
      </p>

    </div>

  `;


  places.forEach((place,index)=>{

    const name =
      place.tags.name;

    const address =
      place.tags["addr:street"] ||
      place.tags["addr:full"] ||
      place.tags["addr:place"] ||
      "Address available nahi hai";


    const distance =
      place.distance < 1
      ? Math.round(place.distance*1000) + " m"
      : place.distance.toFixed(1) + " km";


    let mapLink = "#";


    if(
      place.latitude &&
      place.longitude
    ){

      mapLink =
        `https://www.openstreetmap.org/?mlat=${place.latitude}&mlon=${place.longitude}#map=18/${place.latitude}/${place.longitude}`;

    }


    html += `

      <div class="card">

        <h3>
          ${index+1}. ${escapeHtml(name)}
        </h3>

        <p>
          📍 ${escapeHtml(address)}
        </p>

        <p class="distance">
          📏 ${distance} away
        </p>

        <a
          class="action"
          href="${mapLink}"
          target="_blank"
        >
          🗺️ Open Map
        </a>

      </div>

    `;

  });


  result.innerHTML = html;

}


/* SECURITY */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
