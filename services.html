<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lovepreet Local Services</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px 14px;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
}

.app{
  max-width:520px;
  margin:auto;
}

h1{text-align:center;margin-bottom:8px}

.subtitle{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:22px;
}

.box{
  background:#1e293b;
  padding:18px;
  border-radius:22px;
}

input,select{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:13px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:0;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
}

.primary{
  background:white;
  color:#0f172a;
}

.location-btn{
  background:#2563eb;
  color:white;
}

.result{margin-top:20px}

.card{
  background:white;
  color:#0f172a;
  padding:16px;
  margin-top:12px;
  border-radius:18px;
}

.card h3{margin-top:0}

.distance{
  color:#2563eb;
  font-weight:bold;
}

.action{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#16a34a;
  color:white;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
}

.call{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#2563eb;
  color:white;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
}

.error{
  color:#dc2626;
  font-weight:bold;
}

.small{
  color:#64748b;
  font-size:14px;
}
</style>
</head>

<body>

<div class="app">

<h1>📍 Local Service Finder</h1>

<div class="subtitle">
Apne area ke nearby services dhoondo
</div>

<div class="box">

<input
id="area"
type="text"
placeholder="Apna area likho..."
>

<select id="service">

<option value="">Service choose karo</option>

<option value="plumber">🔧 Plumber</option>
<option value="electrician">⚡ Electrician</option>
<option value="mobile">📱 Mobile Repair</option>
<option value="bike">🛵 Bike Repair</option>
<option value="ac">❄️ AC Repair</option>
<option value="barber">💇 Barber</option>
<option value="cleaning">🧹 Cleaning</option>

</select>

<button
class="location-btn"
onclick="useMyLocation()">
📍 Use My Location
</button>

<button
class="primary"
onclick="searchService()">
🔎 Search Service
</button>

</div>

<div id="result" class="result"></div>

</div>

<script>

let userLatitude=null;
let userLongitude=null;


/* LOCATION */

function useMyLocation(){

const result=document.getElementById("result");

if(!navigator.geolocation){

result.innerHTML=`
<div class="card">
<p class="error">❌ Location support nahi hai.</p>
</div>`;

return;
}

result.innerHTML=`
<div class="card">
<h3>📍 Location find ho rahi hai...</h3>
<p>Location permission allow karo.</p>
</div>`;

navigator.geolocation.getCurrentPosition(

function(position){

userLatitude=position.coords.latitude;
userLongitude=position.coords.longitude;

result.innerHTML=`
<div class="card">
<h3>✅ Location mil gayi!</h3>
<p>Ab service select karke Search Service dabao.</p>
</div>`;

},

function(){

result.innerHTML=`
<div class="card">
<h3>❌ Location nahi mili</h3>
<p>Location permission allow karke dobara try karo.</p>
</div>`;

},

{
enableHighAccuracy:false,
timeout:15000,
maximumAge:300000
}

);

}


/* DISTANCE */

function distanceKm(lat1,lon1,lat2,lon2){

const R=6371;

const dLat=(lat2-lat1)*Math.PI/180;
const dLon=(lon2-lon1)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}


/* SEARCH SERVER */

async function requestOverpass(query){

const servers=[

"https://overpass-api.de/api/interpreter",

"https://overpass.kumi.systems/api/interpreter",

"https://overpass.private.coffee/api/interpreter"

];

let lastError=null;

for(const server of servers){

try{

const response=await fetch(server,{
method:"POST",
headers:{
"Content-Type":"text/plain"
},
body:query
});

if(!response.ok){
throw new Error("Server error");
}

const data=await response.json();

return data;

}catch(error){

lastError=error;

}

}

throw lastError || new Error("All servers failed");

}


/* SEARCH */

async function searchService(){

const service=
document.getElementById("service").value;

const area=
document.getElementById("area").value.trim();

const result=
document.getElementById("result");

if(!service){

alert("Pehle service choose karo 😄");
return;

}

if(userLatitude===null){

if(!area){

alert("Pehle Use My Location dabao 📍");
return;

}

alert(
"Area search ke liye abhi GPS location allow karo 📍"
);

return;

}


const names={

plumber:"Plumber",
electrician:"Electrician",
mobile:"Mobile Repair",
bike:"Bike Repair",
ac:"AC Repair",
barber:"Barber",
cleaning:"Cleaning"

};

const serviceName=names[service];


result.innerHTML=`
<div class="card">
<h3>🔎 ${serviceName} search ho raha hai...</h3>
<p>Nearby places check kar rahe hain...</p>
</div>`;


/* LIGHTWEIGHT QUERY */

let filters="";

if(service==="plumber"){
filters=`
nwr(around:5000,${userLatitude},${userLongitude})["craft"="plumber"];
nwr(around:5000,${userLatitude},${userLongitude})["name"~"plumb",i];
`;
}

else if(service==="electrician"){
filters=`
nwr(around:5000,${userLatitude},${userLongitude})["craft"="electrician"];
nwr(around:5000,${userLatitude},${userLongitude})["name"~"electric",i];
`;
}

else if(service==="mobile"){
filters=`
nwr(around:5000,${userLatitude},${userLongitude})["shop"="mobile_phone"];
nwr(around:5000,${userLatitude},${userLongitude})["name"~"mobile|repair",i];
`;
}

else if(service==="bike"){
filters=`
nwr(around:5000,${userLatitude},${userLongitude})["shop"="motorcycle"];
nwr(around:5000,${userLatitude},${userLongitude})["name"~"bike|motorcycle|repair",i];
`;
}

else if(service==="ac"){
filters=`
nwr(around:5000,${userLatitude},${userLongitude})["craft"="hvac"];
nwr(around:5000,${userLatitude},${userLongitude})["name"~"AC|air conditioner",i];
`;
}

else if(service==="barber"){
filters=`
nwr(around:5000,${userLatitude},${userLongitude})["shop"="barber"];
nwr(around:5000,${userLatitude},${userLongitude})["shop"="hairdresser"];
`;
}

else if(service==="cleaning"){
filters=`
nwr(around:5000,${userLatitude},${userLongitude})["craft"="cleaning"];
nwr(around:5000,${userLatitude},${userLongitude})["name"~"clean",i];
`;
}


const query=`
[out:json][timeout:15];

(
${filters}
);

out center tags;
`;


try{

const data=await requestOverpass(query);

let places=data.elements||[];


/* ONLY NAMED */

places=places.filter(p=>
p.tags && p.tags.name
);


/* REMOVE DUPLICATES */

const seen=new Set();

places=places.filter(p=>{

const key=
p.tags.name.toLowerCase();

if(seen.has(key)){
return false;
}

seen.add(key);
return true;

});


/* DISTANCE */

places=places.map(p=>{

const lat=
p.lat ??
p.center?.lat;

const lon=
p.lon ??
p.center?.lon;

let distance=999;

if(lat!==undefined && lon!==undefined){

distance=distanceKm(
userLatitude,
userLongitude,
lat,
lon
);

}

return{
...p,
latitude:lat,
longitude:lon,
distance:distance
};

});


places.sort((a,b)=>
a.distance-b.distance
);

places=places.slice(0,15);

showResults(
places,
serviceName
);


}catch(error){

console.error(error);

result.innerHTML=`
<div class="card">

<h3>⚠️ Search abhi nahi ho paayi</h3>

<p>
Free map servers busy hain.
</p>

<p>
Internet ON rakho aur 20–30 seconds
baad dobara Search Service dabao.
</p>

<p class="small">
Agar baar-baar ye message aaye,
to hum Google ke bina ek aur better
method laga denge.
</p>

</div>`;

}

}


/* RESULTS */

function showResults(places,serviceName){

const result=
document.getElementById("result");


if(places.length===0){

result.innerHTML=`
<div class="card">

<h3>😕 Nearby result nahi mila</h3>

<p>
OpenStreetMap par is service ki
listing available nahi mili.
</p>

<p class="small">
Dusri service try karo.
</p>

</div>`;

return;

}


let html=`

<div class="card">

<h3>
🔎 ${serviceName}
</h3>

<p>
✅ ${places.length} nearby listing mili
</p>

</div>

`;


places.forEach((place,index)=>{

const name=
place.tags.name;

const address=
place.tags["addr:full"] ||
place.tags["addr:street"] ||
place.tags["addr:place"] ||
"Address available nahi hai";

const phone=
place.tags.phone ||
place.tags["contact:phone"] ||
"";


const distance=
place.distance<1
?Math.round(place.distance*1000)+" m"
:place.distance.toFixed(1)+" km";


let mapLink="#";

if(
place.latitude!==undefined &&
place.longitude!==undefined
){

mapLink=
`https://www.openstreetmap.org/?mlat=${place.latitude}&mlon=${place.longitude}#map=18/${place.latitude}/${place.longitude}`;

}


html+=`

<div class="card">

<h3>
${index+1}. ${escapeHtml(name)}
</h3>

<p>
📍 ${escapeHtml(address)}
</p>

<p class="distance">
📏 ${distance} away
</p>

${phone!=="" ? `

<a
class="call"
href="tel:${escapeHtml(phone)}">
📞 Call ${escapeHtml(phone)}
</a>

`:""}

<a
class="action"
href="${mapLink}"
target="_blank">
🗺️ Open Map
</a>

</div>

`;

});


result.innerHTML=html;

}


/* SAFETY */

function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
