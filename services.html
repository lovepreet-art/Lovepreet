<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lovepreet Local Services</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .box {
      background: #1e293b;
      padding: 18px;
      border-radius: 22px;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 13px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: white;
      color: #0f172a;
    }

    .location-btn {
      background: #2563eb;
      color: white;
    }

    .result {
      margin-top: 20px;
    }

    .card {
      background: white;
      color: #0f172a;
      padding: 16px;
      margin-top: 12px;
      border-radius: 18px;
    }

    .card h3 {
      margin-top: 0;
    }

    .success {
      color: #16a34a;
      font-weight: bold;
    }

    .error {
      color: #dc2626;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>📍 Local Service Finder</h1>

  <div class="subtitle">
    Apne area mein service dhoondo
  </div>

  <div class="box">

    <input
      id="area"
      type="text"
      placeholder="Apna area likho..."
    >

    <select id="service">

      <option value="">
        Service choose karo
      </option>

      <option value="Plumber">
        🔧 Plumber
      </option>

      <option value="Electrician">
        ⚡ Electrician
      </option>

      <option value="Mobile Repair">
        📱 Mobile Repair
      </option>

      <option value="Bike Repair">
        🛵 Bike Repair
      </option>

      <option value="AC Repair">
        ❄️ AC Repair
      </option>

      <option value="Barber">
        💇 Barber
      </option>

      <option value="Cleaning">
        🧹 Cleaning
      </option>

    </select>

    <button
      class="location-btn"
      onclick="useMyLocation()"
    >
      📍 Use My Location
    </button>

    <button
      class="primary"
      onclick="searchService()"
    >
      🔎 Search Service
    </button>

  </div>

  <div
    class="result"
    id="result"
  ></div>

</div>


<script>

let userLatitude = null;
let userLongitude = null;


/* USE MY LOCATION */

function useMyLocation() {

  const result =
    document.getElementById("result");

  if (!navigator.geolocation) {

    result.innerHTML = `
      <div class="card">
        <p class="error">
          ❌ Is phone/browser mein location
          support nahi karti.
        </p>
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="card">
      <h3>📍 Location find ho rahi hai...</h3>
      <p>Please location permission allow karo.</p>
    </div>
  `;

  navigator.geolocation.getCurrentPosition(

    function(position) {

      userLatitude =
        position.coords.latitude;

      userLongitude =
        position.coords.longitude;

      result.innerHTML = `
        <div class="card">

          <h3>✅ Location mil gayi!</h3>

          <p class="success">
            Ab apni service select karke
            Search Service dabao.
          </p>

        </div>
      `;

    },

    function(error) {

      result.innerHTML = `
        <div class="card">

          <h3>❌ Location nahi mili</h3>

          <p>
            Location permission allow karo
            ya manually apna area likho.
          </p>

        </div>
      `;

    }

  );

}


/* SEARCH SERVICE */

function searchService() {

  const area =
    document.getElementById("area")
      .value
      .trim();

  const service =
    document.getElementById("service")
      .value;

  const result =
    document.getElementById("result");


  if (!service) {

    alert(
      "Bhai pehle service choose karo 😄"
    );

    return;
  }


  if (!area && userLatitude === null) {

    alert(
      "Area likho ya Use My Location dabao 📍"
    );

    return;
  }


  if (userLatitude !== null) {

    result.innerHTML = `

      <div class="card">

        <h3>🔎 Searching Nearby...</h3>

        <p>
          🛠️ Service:
          <b>${service}</b>
        </p>

        <p>
          📍 GPS Location:
          <b>Detected ✅</b>
        </p>

        <p>
          🤖 Lovepreet AI:
          Nearby ${service} providers
          search karne ke liye ready hai.
        </p>

        <p>
          🚀 Real business data connection
          next step mein add hoga.
        </p>

      </div>

    `;

    return;
  }


  result.innerHTML = `

    <div class="card">

      <h3>🔎 Searching...</h3>

      <p>
        📍 Area:
        <b>${area}</b>
      </p>

      <p>
        🛠️ Service:
        <b>${service}</b>
      </p>

      <p>
        🤖 Lovepreet AI nearby
        ${service} providers search
        karne ke liye ready hai.
      </p>

      <p>
        🚀 Real business results
        next step mein connect honge.
      </p>

    </div>

  `;

}

</script>

</body>
</html>
