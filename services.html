<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lovepreet Local Services</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .box {
      background: #1e293b;
      padding: 18px;
      border-radius: 22px;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 13px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
    }

    .primary {
      background: white;
      color: #0f172a;
    }

    .result {
      margin-top: 20px;
    }

    .card {
      background: white;
      color: #0f172a;
      padding: 16px;
      margin-top: 12px;
      border-radius: 18px;
    }

    .card h3 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>📍 Local Service Finder</h1>

  <div class="subtitle">
    Apne area mein service dhoondo
  </div>

  <div class="box">

    <input
      id="area"
      type="text"
      placeholder="Apna area likho..."
    >

    <select id="service">

      <option value="">
        Service choose karo
      </option>

      <option>🔧 Plumber</option>
      <option>⚡ Electrician</option>
      <option>📱 Mobile Repair</option>
      <option>🛵 Bike Repair</option>
      <option>❄️ AC Repair</option>
      <option>💇 Barber</option>
      <option>🧹 Cleaning</option>

    </select>

    <button
      class="primary"
      onclick="searchService()"
    >
      🔎 Search
    </button>

  </div>

  <div
    class="result"
    id="result"
  ></div>

</div>

  const area =
    document.getElementById("area").value.trim();

  const service =
    document.getElementById("service").value;

  const result =
    document.getElementById("result");

    return;

  }

    alert("Bhai service select karo 😄");
    return;

  }
