<!DOCTYPE html>
<html>
<head><link rel="manifest" href="/manifest.json">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovepreet AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 8px 0;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 22px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 24px;
      background: #000;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    video,
    #photo {
      width: 100%;
      display: block;
      border-radius: 24px;
    }

    video {
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: white;
      color: #0f172a;
    }

    .secondary {
      background: #1e293b;
      color: white;
    }

    #fileInput {
      display: none;
    }

    #photo {
      display: none;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 22px;
      background: white;
      color: #0f172a;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      margin: 8px 0 18px;
    }

    .item {
      padding: 13px;
      margin: 8px 0;
      border-radius: 12px;
      background: #f1f5f9;
    }

    .good {
      color: green;
    }

    .warn {
      color: #d97706;
    }

    #status {
      text-align: center;
      color: #cbd5e1;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>❤️ Lovepreet AI</h1>
  <div class="subtitle">Smart Face & Photo Analyzer</div>

  <div class="camera-box">

    <video id="camera" autoplay muted playsinline></video>

    <canvas id="overlay"></canvas>

    <img id="photo">

  </div>

  <button class="primary" onclick="startCamera()">
    📷 Start Camera
  </button>

  <button class="secondary" onclick="takePhoto()">
    📸 Take Photo
  </button>

  <button class="secondary"
    onclick="document.getElementById('fileInput').click()">
    🖼️ Upload Photo
  </button>

  <input
    id="fileInput"
    type="file"
    accept="image/*"
    onchange="uploadPhoto(event)"
  >

  <button class="primary" onclick="analyzeNow()">
    🔎 Analyze Now
  </button>

  <button class="secondary" onclick="location.reload()">
    🔄 Scan Again
  </button>

  <p id="status">Start Camera dabao.</p>

  <div class="result" id="result">

    <h2>✨ Analysis Result</h2>

    <div>Overall Quality</div>

    <div class="score" id="quality">
      --
    </div>

    <div class="item">
      👥 Faces Found:
      <b id="faceCount">--</b>
    </div>

    <div class="item">
      🎯 Detection Confidence:
      <b id="confidence">--</b>
    </div>

    <div class="item">
      💡 Lighting:
      <b id="lighting">--</b>
    </div>

    <div class="item">
      🔍 Face Size:
      <b id="faceSize">--</b>
    </div>

    <div class="item">
      📍 Face Position:
      <b id="facePosition">--</b>
    </div>

    <div class="item">
      📸 Image Status:
      <b id="imageStatus">--</b>
    </div>

    <div class="item">
      💡 Suggestion:
      <b id="suggestion">--</b>
    </div>

  </div>

</div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("overlay");
const photo = document.getElementById("photo");
const statusText = document.getElementById("status");

let detections = [];
let running = false;
let currentImage = null;
let aiLoaded = false;

async function loadAI() {

  if (aiLoaded) return;

  await faceapi.nets.tinyFaceDetector.loadFromUri(
    "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
  );

  aiLoaded = true;
}

async function startCamera() {

  try {

    statusText.innerText = "🤖 AI loading...";

    await loadAI();

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true
      });

    video.srcObject = stream;

    video.style.display = "block";
    photo.style.display = "none";

    video.onloadedmetadata = () => {

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      running = true;
      currentImage = video;

      statusText.innerText =
        "🙂 Face camera ke saamne lao";

      detectFaces();
    };

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "❌ Camera ya AI start nahi hua.";
  }
}

async function detectFaces() {

  if (!running) return;

  try {

    detections =
      await faceapi.detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions()
      );

    drawBoxes();

    if (detections.length > 0) {

      statusText.innerText =
        "✅ " + detections.length + " face detected";

    } else {

      statusText.innerText =
        "🙂 Face camera ke saamne lao";
    }

  } catch (error) {

    console.error(error);
  }

  setTimeout(detectFaces, 500);
}

function drawBoxes() {

  const ctx = canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  detections.forEach(d => {

    const box = d.box;

    ctx.strokeStyle = "#00ff00";
    ctx.lineWidth = 5;

    ctx.strokeRect(
      box.x,
      box.y,
      box.width,
      box.height
    );

  });
}

function takePhoto() {

  if (!video.srcObject) {

    alert("Pehle Start Camera dabao.");
    return;
  }

  const tempCanvas =
    document.createElement("canvas");

  tempCanvas.width = video.videoWidth;
  tempCanvas.height = video.videoHeight;

  const ctx =
    tempCanvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    tempCanvas.width,
    tempCanvas.height
  );

  photo.src =
    tempCanvas.toDataURL("image/jpeg");

  photo.style.display = "block";
  video.style.display = "none";

  currentImage = photo;
  running = false;

  statusText.innerText =
    "📸 Photo captured. Analyze Now dabao.";
}

function uploadPhoto(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  const reader =
    new FileReader();

  reader.onload = async function(e) {

    photo.src = e.target.result;

    photo.onload = async function() {

      video.style.display = "none";
      photo.style.display = "block";

      currentImage = photo;
      running = false;

      statusText.innerText =
        "🖼️ Photo loaded. Analyze Now dabao.";

      try {

        await loadAI();

        detections =
          await faceapi.detectAllFaces(
            photo,
            new faceapi.TinyFaceDetectorOptions()
          );

      } catch (error) {

        console.error(error);

        detections = [];
      }
    };
  };

  reader.readAsDataURL(file);
}

function analyzeNow() {

  if (!detections.length) {

    alert(
      "Face detect nahi hua. Clear photo try karo."
    );

    return;
  }

  const first =
    detections[0];

  const confidence =
    Math.round(first.score * 100);

  const box =
    first.box;

  const imageWidth =
    currentImage.videoWidth ||
    currentImage.naturalWidth;

  const imageHeight =
    currentImage.videoHeight ||
    currentImage.naturalHeight;

  const faceArea =
    (box.width * box.height) /
    (imageWidth * imageHeight);

  let faceSize;

  if (faceArea > 0.12) {

    faceSize = "Good 👍";

  } else {

    faceSize = "Face thoda door hai";
  }

  const centerX =
    box.x + box.width / 2;

  const centerY =
    box.y + box.height / 2;

  const imageCenterX =
    imageWidth / 2;

  const imageCenterY =
    imageHeight / 2;

  const distance =
    Math.sqrt(
      Math.pow(centerX - imageCenterX, 2) +
      Math.pow(centerY - imageCenterY, 2)
    );

  const maxDistance =
    Math.sqrt(
      Math.pow(imageCenterX, 2) +
      Math.pow(imageCenterY, 2)
    );

  const positionScore =
    1 - distance / maxDistance;

  let facePosition;

  if (positionScore > 0.65) {

    facePosition = "Centered ✅";

  } else {

    facePosition = "Move face toward center";
  }

  let lighting;

  if (confidence >= 85) {

    lighting = "Good 👍";

  } else if (confidence >= 65) {

    lighting = "Okay 🙂";

  } else {

    lighting = "Improve lighting 💡";
  }

  let quality =
    Math.round(
      confidence * 0.5 +
      Math.min(faceArea * 400, 100) * 0.2 +
      Math.max(positionScore, 0) * 100 * 0.3
    );

  quality =
    Math.max(0, Math.min(100, quality));

  let suggestion;

  if (quality >= 85) {

    suggestion =
      "Photo looks clear. Great! ✨";

  } else if (quality >= 65) {

    suggestion =
      "Thodi better lighting/position try karo.";

  } else {

    suggestion =
      "Face ko closer aur lighting ko better karo.";
  }

  document.getElementById("result")
    .style.display = "block";

  document.getElementById("quality")
    .innerText =
    quality + "/100";

  document.getElementById("faceCount")
    .innerText =
    detections.length;

  document.getElementById("confidence")
    .innerText =
    confidence + "%";

  document.getElementById("lighting")
    .innerText =
    lighting;

  document.getElementById("faceSize")
    .innerText =
    faceSize;

  document.getElementById("facePosition")
    .innerText =
    facePosition;

  document.getElementById("imageStatus")
    .innerText =
    "Face clearly visible ✅";

  document.getElementById("suggestion")
    .innerText =
    suggestion;

  statusText.innerText =
    "🎉 Analysis complete!";
}

</script>

</body>
</html>
