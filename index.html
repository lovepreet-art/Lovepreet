<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovepreet AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px 15px;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    h1 { margin-bottom: 5px; }

    .camera-box {
      position: relative;
      max-width: 430px;
      margin: 20px auto;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 22px;
      background: black;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    button {
      width: 100%;
      max-width: 430px;
      padding: 16px;
      margin: 8px 0;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
    }

    #result {
      display: none;
      max-width: 430px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      color: #111827;
      border-radius: 20px;
    }

    .big {
      font-size: 30px;
      font-weight: bold;
    }

    #status {
      color: #d1d5db;
    }
  </style>
</head>

<body>

<h1>❤️ Lovepreet AI</h1>
<p>Smart Face Detector</p>

<div class="camera-box">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<button onclick="startCamera()">📷 Start Camera</button>
<button onclick="analyzeNow()">🔎 Analyze Now</button>
<button onclick="location.reload()">🔄 Try Again</button>

<p id="status">Start Camera dabao.</p>

<div id="result">
  <h2>✨ Analysis Result</h2>

  <p>Face Status</p>
  <div class="big" id="faceResult">--</div>

  <p>Detection Confidence</p>
  <div class="big" id="confidence">--</div>
</div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("overlay");
const statusText = document.getElementById("status");

let latestDetection = null;
let running = false;

async function startCamera() {

  try {

    statusText.innerText = "🤖 AI loading...";

    await faceapi.nets.tinyFaceDetector.loadFromUri(
      "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
    );

    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });

    video.srcObject = stream;

    video.onloadedmetadata = () => {

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      running = true;
      statusText.innerText = "🙂 Face camera ke saamne lao";

      detectFace();
    };

  } catch (error) {

    console.error(error);
    statusText.innerText =
      "❌ Camera ya AI start nahi hua.";
  }
}

async function detectFace() {

  if (!running) return;

  latestDetection = await faceapi.detectSingleFace(
    video,
    new faceapi.TinyFaceDetectorOptions()
  );

  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (latestDetection) {

    const box = latestDetection.box;

    ctx.strokeStyle = "#00ff00";
    ctx.lineWidth = 5;

    ctx.strokeRect(
      box.x,
      box.y,
      box.width,
      box.height
    );

    statusText.innerText = "✅ Face detected";

  } else {

    statusText.innerText =
      "🙂 Face camera ke saamne lao";
  }

  setTimeout(detectFace, 500);
}

function analyzeNow() {

  if (!latestDetection) {

    alert("Pehle camera ke saamne face lao.");
    return;
  }

  document.getElementById("result").style.display = "block";

  document.getElementById("faceResult").innerText =
    "Detected ✅";

  document.getElementById("confidence").innerText =
    Math.round(latestDetection.score * 100) + "%";

  statusText.innerText =
    "🎉 Analysis complete!";
}

</script>

</body>
</html>
