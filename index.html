<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovepreet Face Detector</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .camera {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 20px auto;
    }

    video {
      width: 100%;
      border-radius: 20px;
      display: block;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    button {
      padding: 15px 25px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      margin: 15px;
    }
  </style>
</head>

<body>

<h1>❤️ Lovepreet AI</h1>
<p>Face Detection</p>

<div class="camera">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<button onclick="startCamera()">📷 Start Camera</button>

<p id="status">Start Camera dabao.</p>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("overlay");
const statusText = document.getElementById("status");

async function startCamera() {

  try {

    statusText.innerText = "🤖 AI loading...";

    await faceapi.nets.tinyFaceDetector.loadFromUri(
      "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
    );

    statusText.innerText = "📷 Camera starting...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });

    video.srcObject = stream;

    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      statusText.innerText = "🙂 Face camera ke saamne lao";

      detectFace();
    };

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "❌ AI ya camera start nahi hua.";
  }
}

async function detectFace() {

  const detection = await faceapi.detectSingleFace(
    video,
    new faceapi.TinyFaceDetectorOptions()
  );

  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (detection) {

    const box = detection.box;

    ctx.strokeStyle = "#00ff00";
    ctx.lineWidth = 5;

    ctx.strokeRect(
      box.x,
      box.y,
      box.width,
      box.height
    );

    statusText.innerText = "✅ Face detected!";

  } else {

    statusText.innerText =
      "🙂 Face camera ke saamne lao";
  }

  setTimeout(detectFace, 500);
}

</script>

</body>
</html>
