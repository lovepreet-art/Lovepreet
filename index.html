<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovepreet AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 32px;
    }

    .subtitle {
      color: #d1d5db;
      margin-bottom: 20px;
    }

    .camera-box {
      max-width: 430px;
      margin: auto;
      position: relative;
    }

    video {
      width: 100%;
      border-radius: 22px;
      background: black;
      display: block;
      transform: scaleX(-1);
    }

    button {
      width: 100%;
      max-width: 430px;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 15px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin: 18px 0;
      color: #e5e7eb;
    }

    #result {
      display: none;
      max-width: 430px;
      margin: 20px auto;
      padding: 22px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
    }

    .value {
      font-size: 28px;
      font-weight: bold;
      margin: 8px;
    }

    .privacy {
      max-width: 430px;
      margin: 25px auto 0;
      font-size: 12px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

  <h1>❤️ Lovepreet AI</h1>
  <div class="subtitle">AI Face Analyzer</div>

  <div class="camera-box">
    <video id="camera" autoplay muted playsinline></video>
  </div>

  <button onclick="startCamera()">📷 Start Camera</button>

  <p id="status">Camera start karo.</p>

  <div id="result">
    <h2>🔎 Analysis Result</h2>

    <p>🙂 Face</p>
    <div class="value" id="face">--</div>

    <p>🎂 Estimated Age</p>
    <div class="value" id="age">--</div>
  </div>

  <div class="privacy">
    🔒 Camera analysis is performed for this app experience.
  </div>

<script>

const video = document.getElementById("camera");
const statusText = document.getElementById("status");

let analyzing = false;

async function loadAI() {

  statusText.innerText = "🤖 AI model loading...";

  await faceapi.nets.tinyFaceDetector.loadFromUri(
    "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
  );

  await faceapi.nets.ageGenderNet.loadFromUri(
    "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/"
  );

  statusText.innerText = "✅ AI ready";
}

async function startCamera() {

  if (analyzing) return;

  try {

    statusText.innerText = "📷 Starting camera...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });

    video.srcObject = stream;

    await loadAI();

    analyzing = true;

    statusText.innerText = "🙂 Face camera ki taraf karo";

    video.onplaying = () => {
      analyzeFace();
    };

  } catch (error) {

    console.error(error);

    statusText.innerText =
      "❌ Camera start nahi hua.";
  }
}

async function analyzeFace() {

  const detection = await faceapi
    .detectSingleFace(
      video,
      new faceapi.TinyFaceDetectorOptions()
    )
    .withAgeAndGender();

  if (detection) {

    const age = Math.round(detection.age);

    document.getElementById("result").style.display = "block";

    document.getElementById("face").innerText =
      "Detected ✅";

    document.getElementById("age").innerText =
      age + " years";

    statusText.innerText =
      "🎉 Analysis complete";

  } else {

    statusText.innerText =
      "🙂 Face detect nahi hua — camera ki taraf dekho";
  }

  if (analyzing) {
    setTimeout(analyzeFace, 1000);
  }
}

</script>

</body>
</html>
